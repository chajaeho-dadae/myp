<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>끝말잇기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --yellow: #FFD400; --yellow-deep: #EFC200; --yellow-soft: #FFF7D6;
    --ink: #141414; --gray: #9B9B9B; --gray-2: #C6C6C6;
    --line: #EFEFEF; --surface: #F6F6F6;
    --bounce: cubic-bezier(.34, 1.56, .64, 1);
  }
  html, body { height: 100%; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-weight: 600; color: var(--ink); background: #fff;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  strong { font-weight: 600; }
  input, button { font-family: inherit; font-weight: 600; }
  iconify-icon { display: block; }

  .app { position: relative; width: 100%; max-width: 430px; height: 100vh; height: 100dvh;
    margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; }
  .stage { position: relative; flex: 1; min-height: 0; }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: 0 26px 28px; overflow-y: auto; opacity: 0; visibility: hidden; pointer-events: none; }
  .screen::-webkit-scrollbar { display: none; }
  .screen.active { opacity: 1; visibility: visible; pointer-events: auto; }

  .btn { height: 56px; border: 0; border-radius: 8px; font-size: 16px;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
  .btn iconify-icon { font-size: 20px; }
  .btn--primary { background: var(--yellow); color: var(--ink); }
  .btn--primary:active { transform: scale(.93); background: var(--yellow-deep); }
  .btn--ghost { background: var(--surface); color: var(--ink); }
  .btn--ghost:active { transform: scale(.93); background: #EAEAEA; }
  .btn[disabled] { background: var(--yellow-soft); color: var(--yellow-deep); pointer-events: none; }

  .icon-btn { width: 40px; height: 40px; flex: 0 0 40px; border: 0; border-radius: 8px;
    background: transparent; color: var(--ink); display: grid; place-items: center;
    font-size: 22px; cursor: pointer; }
  .icon-btn:active { transform: scale(.85); background: var(--surface); }

  .page-head { display: flex; align-items: center; gap: 10px; padding-top: 18px; }
  .page-head h1 { flex: 1; text-align: center; font-size: 17px; letter-spacing: -.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page-head .spacer { width: 40px; flex: 0 0 40px; }

  .mini-avatar { width: 40px; height: 40px; flex: 0 0 40px; border: 0; border-radius: 50%;
    background: var(--surface); color: var(--gray); display: grid; place-items: center;
    font-size: 14px; cursor: pointer; overflow: hidden; }
  .mini-avatar:active { transform: scale(.88); }
  .mini-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .field { position: relative; }
  .field input { width: 100%; border: 0; background: transparent; outline: none;
    font-size: 17px; line-height: 1.2; color: var(--ink); padding: 24px 0 12px; }
  .field input::placeholder { color: transparent; }
  .field label { position: absolute; left: 0; top: 24px; font-size: 16px; color: var(--gray);
    pointer-events: none; transform-origin: left top;
    transition: top .32s var(--bounce), transform .32s var(--bounce), color .18s; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label {
    top: -2px; transform: scale(.74); color: var(--yellow-deep); }
  .field .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    border-radius: 2px; background: var(--line); overflow: hidden; }
  .field .bar::after { content: ''; position: absolute; inset: 0; border-radius: 2px;
    background: var(--yellow); transform: scaleX(0); transform-origin: left center;
    transition: transform .38s var(--bounce); }
  .field input:focus ~ .bar::after { transform: scaleX(1); }

  .screen--entry { justify-content: center; }
  .brand { text-align: center; }
  .brand h1 { font-size: 30px; letter-spacing: -.03em; }
  .brand p { margin-top: 8px; font-size: 14px; color: var(--gray); }
  .identity { margin-top: 52px; display: flex; align-items: center; gap: 16px; }
  .avatar { width: 58px; height: 58px; flex: 0 0 58px; border: 0; border-radius: 50%;
    background: var(--surface); color: var(--gray-2); display: grid; place-items: center;
    font-size: 25px; cursor: pointer; overflow: hidden; }
  .avatar:active { transform: scale(.88); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .identity .field { flex: 1; }
  .actions { margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .rooms-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
  .action-card { height: 84px; border: 0; border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; font-size: 14px; cursor: pointer; }
  .action-card iconify-icon { font-size: 24px; }
  .action-card--primary { background: var(--yellow); color: var(--ink); }
  .action-card--primary:active { background: var(--yellow-deep); transform: scale(.95); }
  .action-card--ghost { background: var(--surface); color: var(--ink); }
  .action-card--ghost:active { background: #EAEAEA; transform: scale(.95); }

  .rooms-label { margin-top: 28px; margin-bottom: 10px; font-size: 13px; color: var(--gray);
    display: flex; align-items: center; justify-content: space-between; }
  .refresh-btn { border: 0; background: transparent; color: var(--yellow-deep);
    font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .refresh-btn:active { opacity: .6; }
  .refresh-btn iconify-icon { font-size: 16px; }

  .room-list { list-style: none; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
  .room-card { display: flex; align-items: center; gap: 14px; padding: 14px;
    border-radius: 8px; background: var(--surface); cursor: pointer; }
  .room-card:active { transform: scale(.97); background: var(--yellow-soft); }

  .room-ico { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 8px;
    background: var(--yellow); color: var(--ink); display: grid; place-items: center; font-size: 21px; }
  .room-info { flex: 1; min-width: 0; }
  .room-info strong { display: block; font-size: 15px; letter-spacing: -.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-info span { display: block; margin-top: 3px; font-size: 12px; color: var(--gray); }
  .chev { font-size: 18px; color: var(--gray-2); }

  .empty-state { padding: 40px 20px; text-align: center; color: var(--gray); font-size: 14px; }

  .waiting-code { display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; margin-top: 22px; border-radius: 8px; background: var(--yellow-soft); }
  .waiting-code > span { font-size: 13px; color: var(--yellow-deep); }
  .waiting-code > strong { flex: 1; font-size: 18px; letter-spacing: .12em; color: var(--ink); }
  .copy-btn { width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent;
    color: var(--yellow-deep); display: grid; place-items: center; font-size: 18px; cursor: pointer; }
  .copy-btn:active { transform: scale(.85); background: rgba(0,0,0,.05); }

  .waiting-label { margin-top: 28px; margin-bottom: 12px; font-size: 13px; color: var(--gray);
    display: flex; justify-content: space-between; align-items: center; }
  .waiting-label strong { color: var(--ink); font-weight: 600; }

  .waiting-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .player-slot { display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 8px; border-radius: 8px; background: var(--surface); }
  .slot-avatar { width: 48px; height: 48px; border-radius: 50%;
    background: var(--yellow); color: var(--ink); display: grid; place-items: center;
    font-size: 18px; overflow: hidden; position: relative; }
  .slot-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .slot-crown { position: absolute; top: -6px; right: -6px; font-size: 18px;
    filter: drop-shadow(0 1px 0 white); }
  .slot-name { font-size: 13px; color: var(--ink);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot-status { display: flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--gray); }
  .slot-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--gray-2); }
  .player-slot.ready .slot-status::before { background: var(--yellow); }
  .player-slot.ready .slot-status { color: var(--yellow-deep); }
  .player-slot.me { background: var(--yellow-soft); }
  .player-slot.empty { background: transparent; border: 2px dashed var(--line); }
  .player-slot.empty .slot-avatar { background: transparent; color: var(--gray-2); }
  .player-slot.empty .slot-name { color: var(--gray-2); }
  .player-slot.empty .slot-status { color: var(--gray-2); }

  .waiting-foot { margin-top: auto; padding-top: 24px;
    display: flex; flex-direction: column; gap: 10px; }

  .game-players { display: flex; gap: 10px; margin-top: 22px; justify-content: center;
    flex-wrap: wrap; }
  .game-player { width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface); color: var(--gray);
    display: grid; place-items: center; font-size: 15px;
    position: relative; overflow: hidden; transition: opacity .2s; }
  .game-player.me { background: var(--yellow); color: var(--ink); }
  .game-player img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .game-player.current::after { content: ''; position: absolute; inset: -3px;
    border: 2px solid var(--yellow); border-radius: 50%; pointer-events: none;
    animation: ring 1.4s ease-in-out infinite; }
  @keyframes ring {
    0%, 100% { opacity: .5; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.04); }
  }
  .game-player.eliminated { opacity: .35; }
  .game-player.eliminated::before { content: '✕'; position: absolute; inset: 0;
    display: grid; place-items: center; background: rgba(20,20,20,.4);
    color: #fff; font-size: 18px; z-index: 2; }

  .play-area { flex: 1; min-height: 0;
    display: flex; flex-direction: column; justify-content: center;
    gap: 26px; padding: 20px 0 16px; }

  .chain { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; }
  .chain::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 9px 14px; border-radius: 8px;
    background: var(--surface); color: var(--gray); font-size: 14px; white-space: nowrap; }
  .chip.recent { background: var(--yellow-soft); color: var(--yellow-deep); }

  .word-wrap { text-align: center; }
  .word { display: inline-block; font-size: 46px; letter-spacing: -.035em; }
  .word.swap { animation: wordSwap .55s var(--bounce); }
  @keyframes wordSwap {
    0%   { transform: scale(.4) translateY(20px) rotate(-3deg); opacity: 0; }
    55%  { transform: scale(1.12) translateY(-4px) rotate(1.5deg); opacity: 1; }
    100% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; }
  }
  .hint { display: block; margin-top: 12px; font-size: 14px; color: var(--gray); }
  .hint b { color: var(--yellow-deep); }

  .timer { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .timer-fill { height: 100%; width: 100%; border-radius: 4px; background: var(--yellow);
    transition: width .1s linear; }
  .timer-fill.danger { background: #FF6B4A; }

  .composer { display: flex; align-items: center; gap: 12px; }
  .composer .field { flex: 1; }
  .composer.locked .field input { color: var(--gray); cursor: not-allowed; }
  .send { width: 54px; height: 54px; flex: 0 0 54px;
    border: 0; border-radius: 8px; background: var(--yellow); color: var(--ink);
    display: grid; place-items: center; font-size: 23px; cursor: pointer; }
  .send:active { transform: scale(.86); background: var(--yellow-deep); }
  .send[disabled] { background: var(--yellow-soft); color: var(--yellow-deep); pointer-events: none; }

  .screen--result { justify-content: center; text-align: center; }
  .result-inner { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .result-icon { font-size: 80px; line-height: 1; }
  .result-title { font-size: 32px; letter-spacing: -.03em; }
  .result-sub { font-size: 15px; color: var(--gray); }
  .result-actions { margin-top: 32px; display: flex; flex-direction: column;
    gap: 10px; width: 100%; max-width: 300px; }

  .backdrop { position: fixed; inset: 0; z-index: 30;
    background: rgba(20,20,20,.3); opacity: 0; visibility: hidden;
    transition: opacity .25s ease, visibility .25s; }
  .backdrop.on { opacity: 1; visibility: visible; }

  .sheet { position: fixed; left: 50%; bottom: 0; z-index: 31;
    width: 100%; max-width: 430px; max-height: 82dvh;
    display: flex; flex-direction: column; padding: 10px 26px 30px;
    border-radius: 8px 8px 0 0; background: #fff;
    transform: translate(-50%, 105%); transition: transform .48s var(--bounce); }
  .sheet.on { transform: translate(-50%, 0); }
  .sheet--profile { z-index: 41; }
  .backdrop--pf { z-index: 40; }

  .sheet-handle { width: 40px; height: 4px; border-radius: 4px;
    background: var(--line); margin: 0 auto 18px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .sheet-head h2 { font-size: 19px; letter-spacing: -.02em; }
  .sheet-body { display: flex; flex-direction: column; gap: 20px; padding: 8px 0 20px; }
  .sheet-label { font-size: 13px; color: var(--gray); margin-top: 4px; }
  .sheet-help { font-size: 13px; color: var(--gray); }

  .pill-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .pill-row::-webkit-scrollbar { display: none; }
  .pill { flex: 1; min-width: 44px; height: 44px; border: 0; border-radius: 8px;
    background: var(--surface); color: var(--ink); font-size: 14px; cursor: pointer; }
  .pill:active { background: #EAEAEA; }
  .pill.active { background: var(--yellow); color: var(--ink); }

  .pf-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .pf-scroll::-webkit-scrollbar { display: none; }
  .pf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 4px 2px 6px; }
  .pf-item { display: block; width: 100%; border: 0; padding: 0;
    border-radius: 8px; background: var(--surface); overflow: hidden;
    cursor: pointer; aspect-ratio: 1 / 1; position: relative; }
  .pf-item:active { transform: scale(.92); }
  .pf-item img { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; }

  .toast { position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 20px);
    padding: 12px 20px; border-radius: 8px; background: rgba(20,20,20,.9);
    color: #fff; font-size: 14px; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    max-width: 90vw; text-align: center; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* 자동 진단 배너 */
  #connBanner { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    padding: 12px 16px; background: #FF6B4A; color: #fff;
    font-size: 13px; line-height: 1.4; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #connBanner button { margin-left: 8px; border: 0; background: rgba(255,255,255,.25);
    color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }

  /* 사전 로딩 표시 */
  .dict-badge { display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--gray); margin-left: 6px; }
  .dict-badge.loading::before { content: '⏳'; }
  .dict-badge.ready::before { content: '✅'; }
  .dict-badge.failed::before { content: '⚠️'; }
</style>
</head>
<body>

<div id="connBanner">
  <span id="connBannerText"></span>
  <button onclick="document.getElementById('connBanner').style.display='none'">닫기</button>
</div>

<div class="app">
  <div class="stage">

    <!-- 1. 입장 -->
    <section class="screen screen--entry active" data-screen="entry">
      <div class="brand">
        <h1>끝말잇기</h1>
        <p>닉네임만 정하면 바로 시작할 수 있어요</p>
      </div>
      <div class="identity">
        <button class="avatar" id="avatarBtn" type="button" aria-label="프로필 사진 선택">
          <iconify-icon icon="solar:camera-bold" id="avatarIcon"></iconify-icon>
          <img id="avatarImg" alt="" style="display:none" />
        </button>
        <div class="field">
          <input id="nickname" type="text" placeholder=" " autocomplete="off" maxlength="10" />
          <label for="nickname">닉네임</label>
          <span class="bar"></span>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn--primary" data-nav="rooms">
          <iconify-icon icon="solar:play-bold"></iconify-icon>
          바로 시작하기
        </button>
        <button class="btn btn--ghost" data-nav="rooms">
          <iconify-icon icon="solar:users-group-rounded-bold"></iconify-icon>
          방 조회하기
        </button>
      </div>
    </section>

    <!-- 2. 방 목록 -->
    <section class="screen screen--rooms" data-screen="rooms">
      <header class="page-head">
        <button class="icon-btn" data-nav="entry" aria-label="뒤로">
          <iconify-icon icon="solar:alt-arrow-left-bold"></iconify-icon>
        </button>
        <h1>방 목록</h1>
        <button class="mini-avatar" id="miniAvatarBtn" aria-label="프로필 변경">
          <span id="miniAvatarText">나</span>
          <img id="miniAvatarImg" alt="" style="display:none" />
        </button>
      </header>

      <div class="rooms-actions">
        <button class="action-card action-card--primary" id="openCreate">
          <iconify-icon icon="solar:add-circle-bold"></iconify-icon>
          <span>방 만들기</span>
        </button>
        <button class="action-card action-card--ghost" id="openJoin">
          <iconify-icon icon="solar:key-bold"></iconify-icon>
          <span>코드로 입장</span>
        </button>
      </div>

      <div class="rooms-label">
        <span>참여 가능한 방</span>
        <button class="refresh-btn" id="refreshRooms">
          <iconify-icon icon="solar:refresh-bold"></iconify-icon>
          새로고침
        </button>
      </div>

      <ul class="room-list" id="roomList">
        <li class="empty-state">불러오는 중...</li>
      </ul>
    </section>

    <!-- 3. 대기방 -->
    <section class="screen screen--waiting" data-screen="waiting">
      <header class="page-head">
        <button class="icon-btn" id="leaveWaiting" aria-label="나가기">
          <iconify-icon icon="solar:alt-arrow-left-bold"></iconify-icon>
        </button>
        <h1 id="waitingRoomName">-</h1>
        <div class="spacer"></div>
      </header>

      <div class="waiting-code">
        <span>방 코드</span>
        <strong id="waitingCode">------</strong>
        <button class="copy-btn" id="copyCode" aria-label="복사">
          <iconify-icon icon="solar:copy-bold"></iconify-icon>
        </button>
      </div>

      <div class="waiting-label">
        <span>참가자</span>
        <strong id="waitingCount">0/0</strong>
      </div>

      <div class="waiting-grid" id="waitingGrid"></div>

      <div class="waiting-foot">
        <button class="btn btn--ghost" id="readyBtn">준비하기</button>
        <button class="btn btn--primary" id="startBtn" style="display:none">게임 시작</button>
      </div>
    </section>

    <!-- 4. 게임 -->
    <section class="screen screen--game" data-screen="game">
      <header class="page-head">
        <button class="icon-btn" id="gameBackBtn" aria-label="나가기">
          <iconify-icon icon="solar:alt-arrow-left-bold"></iconify-icon>
        </button>
        <h1 id="gameRoomName">-</h1>
        <div class="spacer"></div>
      </header>

      <div class="game-players" id="gamePlayers"></div>

      <div class="play-area">
        <div class="chain" id="chain"></div>

        <div class="word-wrap">
          <span class="word" id="word">-</span>
          <span class="hint" id="hint"></span>
          <span class="dict-badge loading" id="dictBadge">사전 로딩 중</span>
        </div>

        <div class="timer"><div class="timer-fill" id="timerFill"></div></div>

        <div class="composer" id="composer">
          <div class="field">
            <input type="text" id="wordInput" placeholder=" " autocomplete="off" maxlength="15" />
            <label id="wordLabel">단어 입력</label>
            <span class="bar"></span>
          </div>
          <button class="send" id="sendBtn" aria-label="입력">
            <iconify-icon icon="solar:arrow-right-bold"></iconify-icon>
          </button>
        </div>
      </div>
    </section>

    <!-- 5. 결과 -->
    <section class="screen screen--result" data-screen="result">
      <div class="result-inner">
        <div class="result-icon" id="resultIcon">🏆</div>
        <h1 class="result-title" id="resultTitle">우승!</h1>
        <p class="result-sub" id="resultSub">-</p>
        <div class="result-actions">
          <button class="btn btn--primary" id="rematchBtn">다시 하기</button>
          <button class="btn btn--ghost" id="leaveResult">나가기</button>
        </div>
      </div>
    </section>

  </div>
</div>

<!-- 방 만들기 시트 -->
<div class="backdrop" data-sheet="create"></div>
<aside class="sheet" data-sheet="create">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2>방 만들기</h2>

async function loadDictionary() {
  const badge = document.getElementById('dictBadge');
  try {
    const res = await fetch(DICT_URL, { cache: 'force-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const HANGUL = /^[가-힣]{2,15}$/;
    const set = new Set();
    for (const line of text.split('\n')) {
      const w = line.trim();
      if (HANGUL.test(w)) set.add(w);
    }
    DICT = set;
    dictStatus = 'ready';
    if (badge) { badge.className = 'dict-badge ready'; badge.textContent = `${set.size.toLocaleString()}단어 사전`; }
    console.log('📖 사전 로드 완료:', set.size, '단어');
  } catch (e) {
    dictStatus = 'failed';
    if (badge) { badge.className = 'dict-badge failed'; badge.textContent = '사전 로드 실패 (기본 룰만 적용)'; }

  }[m]));
}

      showBanner('⚠️ 테이블이 없습니다. Supabase SQL Editor에서 스키마를 먼저 실행하세요.');

      showBanner('⚠️ 인증 토큰 만료 — anon key를 재발급하세요.');
    } else {
      showBanner('⚠️ DB 오류: ' + error.message);

function navToRooms() {
  unsubAll();
  go('rooms');
  loadRooms();
  app.channels.rooms = sb.channel('rooms-list')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => loadRooms())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, () => loadRooms())
    .subscribe();
}

async function loadRooms() {
  const list = $('roomList');
  try {
    const [{ data: rooms, error: e1 }, { data: allPlayers, error: e2 }] = await Promise.all([
      sb.from('rooms').select('*').eq('status', 'waiting')
        .order('created_at', { ascending: false }).limit(50),
      sb.from('players').select('room_id'),
    ]);
    if (e1) throw e1;
    if (e2) throw e2;

    const counts = {};
    (allPlayers || []).forEach(p => counts[p.room_id] = (counts[p.room_id] || 0) + 1);

    list.innerHTML = '';
    const visible = (rooms || []).filter(r => (counts[r.id] || 0) < r.max_players);

    if (visible.length === 0) {
      list.innerHTML = '<li class="empty-state">아직 대기 중인 방이 없어요.<br>첫 방을 만들어 보세요!</li>';
      return;
    }

    visible.forEach(room => {
      const count = counts[room.id] || 0;
      const li = document.createElement('li');
      li.className = 'room-card';
      li.dataset.roomId = room.id;
      li.innerHTML = `
        <div class="room-ico"><iconify-icon icon="solar:gamepad-bold"></iconify-icon></div>
        <div class="room-info">
          <strong>${escapeHtml(room.name)}</strong>
          <span>${count} / ${room.max_players}명 · 대기 중</span>
        </div>
        <iconify-icon class="chev" icon="solar:alt-arrow-right-bold"></iconify-icon>`;
      li.addEventListener('click', () => joinByCode(room.code));
      list.appendChild(li);
    });
  } catch (err) {
    list.innerHTML = `<li class="empty-state">불러오기 실패: ${escapeHtml(err.message || err)}</li>`;
  }
}

$('refreshRooms').addEventListener('click', loadRooms);

async function joinByCode(code) {

    const { data, error } = await sb.rpc('join_room', {
      p_code: code,
      p_client_id: app.profile.clientId,
      p_nickname: app.profile.nickname,
      p_avatar_url: app.profile.avatar,
    });

    if (!data.ok) {
      const msg = {
        room_not_found: '방을 찾을 수 없어요',
        not_waiting: '이미 게임이 시작된 방이에요',
        full: '방이 가득 찼어요',
      }[data.error] || data.error;
      throw new Error(msg);

    closeSheet('join');
    await enterRoom(data.room_id, data.player_id);
  } catch (err) {
    toast(err.message);
  }
}

/* ═══════════════════════════════════════════════════
   방 진입
═══════════════════════════════════════════════════ */
async function enterRoom(roomId, playerId) {
  unsubAll();
  app.room = null;
  app.player = { id: playerId };

  const [{ data: room, error: e1 }, { data: me, error: e2 }] = await Promise.all([
    sb.from('rooms').select('*').eq('id', roomId).single(),
    sb.from('players').select('*').eq('id', playerId).single(),
  ]);
  if (e1 || !room) { toast('방을 불러올 수 없어요'); return; }
  if (e2 || !me) { toast('플레이어 정보를 불러올 수 없어요'); return; }

  app.room = room;
  app.player = me;

  if (room.status === 'playing') { await gotoGame(roomId); return; }
  if (room.status === 'finished') { await gotoResult(roomId); return; }
  navToWaiting();
}

function navToWaiting() {
  unsubAll();
  go('waiting');
  renderWaiting();
  subscribeWaiting();
}

function subscribeWaiting() {
  const rid = app.room.id;
  app.channels.waiting = sb.channel('waiting-' + rid)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'players', filter: `room_id=eq.${rid}` },
      () => reloadWaitingPlayers())
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${rid}` },
      (payload) => {
        app.room = payload.new;
        if (payload.new.status === 'playing') gotoGame(rid);
        else if (payload.new.status === 'finished') gotoResult(rid);
      })
    .on('postgres_changes',
      { event: 'DELETE', schema: 'public', table: 'rooms', filter: `id=eq.${rid}` },
      () => { unsubAll(); toast('방이 삭제되었어요'); navToRooms(); })
    .subscribe();
}

async function reloadWaitingPlayers() {
  if (!app.room) return;
  const { data } = await sb.from('players').select('*')
    .eq('room_id', app.room.id).order('joined_at');
  app.players = data || [];
  renderWaiting();
}

async function renderWaiting() {
  if (!app.room) return;
  $('waitingRoomName').textContent = app.room.name;
  $('waitingCode').textContent = app.room.code;

  if (app.players.length === 0) { await reloadWaitingPlayers(); return; }
  
('waitingCount').textContent=`{app.players.length}/${app.room.max_players}`;

  const grid = $('waitingGrid');
  grid.innerHTML = '';

  app.players.forEach(p => {
    const isMe = p.id === app.player.id;
    const slot = document.createElement('div');
    slot.className = 'player-slot' + (isMe ? ' me' : '') + (p.is_ready ? ' ready' : '');

    const av = document.createElement('div');
    av.className = 'slot-avatar';
    if (p.avatar_url) {
      const im = document.createElement('img');
      im.src = p.avatar_url; im.alt = '';
      av.appendChild(im);
    } else {
      av.textContent = p.nickname.charAt(0);
    }
    if (p.is_host) {
      const crown = document.createElement('span');
      crown.className = 'slot-crown';
      crown.textContent = '👑';
      av.appendChild(crown);
    }
    slot.appendChild(av);

    const nm = document.createElement('div');
    nm.className = 'slot-name';
    nm.textContent = p.nickname + (isMe ? ' (나)' : '');
    slot.appendChild(nm);

    const st = document.createElement('div');
    st.className = 'slot-status';
    st.textContent = p.is_ready ? '준비 완료' : '대기 중';
    slot.appendChild(st);
    grid.appendChild(slot);
  });

  const emptyCount = Math.max(0, app.room.max_players - app.players.length);
  for (let i = 0; i < emptyCount; i++) {
    const slot = document.createElement('div');
    slot.className = 'player-slot empty';
    slot.innerHTML = `
      <div class="slot-avatar"><iconify-icon icon="solar:user-plus-rounded-bold"></iconify-icon></div>
      <div class="slot-name">빈 자리</div>
      <div class="slot-status">대기 중</div>`;
    grid.appendChild(slot);
  }

  const isHost = app.room.host_player_id === app.player.id;
  const me = app.players.find(p => p.id === app.player.id);
  const readyBtn = $('readyBtn');
  const startBtn = $('startBtn');

  readyBtn.textContent = me?.is_ready ? '준비 취소' : '준비하기';
  readyBtn.style.display = isHost ? 'none' : '';

  if (isHost) {
    startBtn.style.display = '';
    const canStart = app.players.length >= 2;
    startBtn.disabled = !canStart;
    startBtn.innerHTML = canStart
      ? '<iconify-icon icon="solar:play-bold"></iconify-icon> 게임 시작'
      : `인원 부족 (${app.players.length}/2)`;
  } else {
    startBtn.style.display = 'none';
  }
}

$('readyBtn').addEventListener('click', async () => {
  if (!app.player) return;
  const me = app.players.find(p => p.id === app.player.id);
  const next = !me?.is_ready;
  await sb.rpc('toggle_ready', { p_player_id: app.player.id, p_ready: next });
});

$('startBtn').addEventListener('click', async () => {
  if (!app.room) return;
  const { data, error } = await sb.rpc('start_game', {
    p_room_id: app.room.id, p_player_id: app.player.id,
  });
  if (error) { toast(error.message); return; }
  if (!data.ok) {
    const msg = { not_host: '방장만 시작할 수 있어요', need_players: '2명 이상 필요해요' }[data.error] || data.error;
    toast(msg);
  }
});

$('copyCode').addEventListener('click', () => {
  navigator.clipboard?.writeText(app.room.code).then(() => toast('코드 복사됨'));
});

$('leaveWaiting').addEventListener('click', async () => {
  await leaveCurrentRoom();
  navToRooms();
});

async function leaveCurrentRoom() {
  if (!app.room || !app.player) return;
  try { await sb.rpc('leave_room', { p_room_id: app.room.id, p_player_id: app.player.id }); } catch (e) {}
  unsubAll();
  clearInterval(app.gameTimer);
  app.room = null; app.player = null; app.players = []; app.words = [];
}

/* ═══════════════════════════════════════════════════
   게임
═══════════════════════════════════════════════════ */
async function gotoGame(roomId) {
  unsubAll();
  const { data: room } = await sb.from('rooms').select('*').eq('id', roomId).single();
  if (!room) { toast('방이 없어졌어요'); navToRooms(); return; }
  app.room = room;
  go('game');
  await loadGameData();
  subscribeGame();
  startTimerLoop();
}

async function loadGameData() {
  const rid = app.room.id;
  const [{ data: players }, { data: words }] = await Promise.all([
    sb.from('players').select('*').eq('room_id', rid).order('joined_at'),
    sb.from('words').select('*').eq('room_id', rid).order('created_at'),
  ]);
  app.players = players || [];
  app.words = words || [];
  renderGame();
}

function subscribeGame() {
  const rid = app.room.id;
  app.channels.game = sb.channel('game-' + rid)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'players', filter: `room_id=eq.${rid}` },
      () => loadGameData())
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'words', filter: `room_id=eq.${rid}` },
      () => loadGameData())
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${rid}` },
      (payload) => {
        app.room = payload.new;
        renderGame();
        if (payload.new.status === 'finished') {
          clearInterval(app.gameTimer);
          gotoResult(rid);
        }
      })
    .on('postgres_changes',
      { event: 'DELETE', schema: 'public', table: 'rooms', filter: `id=eq.${rid}` },
      () => { unsubAll(); toast('방이 삭제되었어요'); navToRooms(); })
    .subscribe();
}

function getActivePlayers() {
  return app.players.filter(p => !p.eliminated)
    .sort((a, b) => new Date(a.joined_at) - new Date(b.joined_at));
}
function getCurrentPlayer() {
  const active = getActivePlayers();
  if (active.length === 0) return null;
  return active[app.room.current_turn_index % active.length];
}

function renderGame() {
  if (!app.room) return;
  $('gameRoomName').textContent = app.room.name;

  const gp = $('gamePlayers');
  gp.innerHTML = '';
  app.players.forEach(p => {
    const isMe = p.id === app.player.id;
    const isCurrent = getCurrentPlayer()?.id === p.id;
    const el = document.createElement('div');
    el.className = 'game-player'
      + (isMe ? ' me' : '')
      + (isCurrent ? ' current' : '')
      + (p.eliminated ? ' eliminated' : '');
    el.title = p.nickname;
    if (p.avatar_url) {
      const im = document.createElement('img');
      im.src = p.avatar_url; im.alt = '';
      el.appendChild(im);
    } else {
      el.textContent = p.nickname.charAt(0);
    }
    gp.appendChild(el);
  });

  const chain = $('chain');
  chain.innerHTML = '';
  app.words.forEach((w, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (i >= app.words.length - 2 ? ' recent' : '');
    chip.textContent = w.word;
    chain.appendChild(chip);
  });
  chain.scrollLeft = chain.scrollWidth;

  const wordEl = $('word');
  const newWord = app.room.current_word || '-';
  if (wordEl.textContent !== newWord) {
    wordEl.classList.remove('swap');
    void wordEl.offsetWidth;
    wordEl.textContent = newWord;
    if (app.room.status === 'playing') wordEl.classList.add('swap');
  }

  const lastChar = (app.room.current_word || '').slice(-1);
  $('hint').innerHTML = lastChar
    ? `<b>‘${lastChar}’</b> 로 시작하는 단어를 입력하세요` : '';

  const me = app.players.find(p => p.id === app.player.id);
  const current = getCurrentPlayer();
  const myTurn = current && current.id === app.player.id && !me?.eliminated && app.room.status === 'playing';

  const composer = $('composer');
  const input = $('wordInput');
  const sendBtn = $('sendBtn');
  const label = $('wordLabel');

  if (me?.eliminated) {
    composer.classList.add('locked');
    input.disabled = true; sendBtn.disabled = true;
    label.textContent = '탈락했어요';
    input.value = '';
  } else if (myTurn) {
    composer.classList.remove('locked');
    input.disabled = false; sendBtn.disabled = false;
    label.textContent = '단어 입력';
  } else {
    composer.classList.add('locked');
    input.disabled = true; sendBtn.disabled = true;
    label.textContent = current ? `${current.nickname}님의 차례` : '대기 중';
    input.value = '';
  }
}

function startTimerLoop() {
  clearInterval(app.gameTimer);
  const TOTAL = 15;
  let lastCall = 0;

  app.gameTimer = setInterval(() => {
    if (!app.room || app.room.status !== 'playing' || !app.room.turn_started_at) {
      $('timerFill').style.width = '0%';
      return;
    }
    const elapsed = (Date.now() - new Date(app.room.turn_started_at).getTime()) / 1000;
    const remain = Math.max(0, TOTAL - elapsed);
    const fill = $('timerFill');
    fill.style.width = (remain / TOTAL * 100) + '%';
    fill.classList.toggle('danger', remain <= 5);

    if (remain <= 0) {
      const now = Date.now();
      if (now - lastCall > 300) {
        lastCall = now;
        sb.rpc('handle_timeout', { p_room_id: app.room.id }).catch(() => {});
      }
    }
  }, 100);
}

async function submitWord() {
  const input = $('wordInput');
  const word = input.value.trim();
  if (!word) return;

  /* 클라이언트 사전 검증 */
  if (DICT && !DICT.has(word)) {
    toast('사전에 없는 단어예요');
    return;
  }
  if (dictStatus === 'loading') {
    toast('사전을 불러오는 중이에요. 잠시 후 다시 시도해 주세요');
    return;
  }

  const { data, error } = await sb.rpc('submit_word', {
    p_room_id: app.room.id, p_player_id: app.player.id, p_word: word,
  });
  if (error) { toast('오류: ' + error.message); return; }
  if (!data.ok) {
    const msg = {
      too_short: '2글자 이상 입력하세요',
      duplicate: '이미 사용된 단어예요',
      wrong_char: `'${data.expected}'(으)로 시작해야 해요`,
      not_your_turn: '당신의 차례가 아니에요',
      not_playing: '게임이 진행 중이 아니에요',
      game_over: '게임이 종료되었어요',
    }[data.error] || data.error;
    toast(msg);
    return;
  }
  input.value = '';
}

$('sendBtn').addEventListener('click', submitWord);
$('wordInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitWord();
});

$('gameBackBtn').addEventListener('click', async () => {
  if (!confirm('방에서 나갈까요?')) return;
  await leaveCurrentRoom();
  navToRooms();
});

/* ═══════════════════════════════════════════════════
   결과
═══════════════════════════════════════════════════ */
async function gotoResult(roomId) {
  unsubAll();
  go('result');

  const [{ data: players }, { data: room }] = await Promise.all([
    sb.from('players').select('*').eq('room_id', roomId).order('joined_at'),
    sb.from('rooms').select('*').eq('id', roomId).single(),
  ]);
  if (!room || !players) { navToRooms(); return; }
  app.room = room;
  app.players = players;

  const winner = players.find(p => !p.eliminated);
  const isWinner = winner?.id === app.player.id;
  const isHost = room.host_player_id === app.player.id;

  $('resultIcon').textContent = isWinner ? '🏆' : '😅';
  $('resultTitle').textContent = isWinner ? '우승!' : '탈락!';
  $('resultSub').textContent = isWinner
    ? '마지막까지 살아남았어요'
    : `우승: ${winner?.nickname || '없음'}`;

  $('rematchBtn').style.display = isHost ? '' : 'none';

  app.channels.result = sb.channel('result-' + roomId)
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` },
      (payload) => {
        if (payload.new.status === 'waiting') {
          app.room = payload.new;
          navToWaiting();
        }
      })
    .on('postgres_changes',
      { event: 'DELETE', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` },
      () => { unsubAll(); navToRooms(); })
    .subscribe();

  $('rematchBtn').onclick = async () => {
    const { data, error } = await sb.rpc('reset_room', {
      p_room_id: roomId, p_player_id: app.player.id,
    });
    if (error || !data?.ok) toast('재대결 준비 실패');
  };

  $('leaveResult').onclick = async () => {
    await leaveCurrentRoom();
    navToRooms();
  };
}

/* ═══════════════════════════════════════════════════
   beforeunload
═══════════════════════════════════════════════════ */
window.addEventListener('beforeunload', () => {
  if (app.room && app.player) {
    const url = `${SUPABASE_URL}/rest/v1/rpc/leave_room`;
    fetch(url, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_room_id: app.room.id, p_player_id: app.player.id }),
      keepalive: true,
    }).catch(() => {});
  }
});
</script>
