<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>교실 탈출하기</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#172630;color:white}
header{padding:18px;background:#203b4c;display:flex;justify-content:space-between;flex-wrap:wrap}
main{display:grid;grid-template-columns:2fr 1fr;gap:16px;padding:16px}
.scene{height:500px;position:relative;overflow:hidden;border:5px solid #647780;border-radius:10px;background:linear-gradient(#d8d3c7 0 16%,#d9d0bb 16% 58%,#898b84 58%)}
.window{position:absolute;left:2%;top:20%;width:17%;height:30%;background:#d8ecf3;border:8px solid #e6e1d6}
.board{position:absolute;left:25%;top:25%;width:42%;height:25%;background:#245044;border:10px solid #a68c64;text-align:center;padding-top:20px;box-sizing:border-box}
.door{position:absolute;right:4%;top:25%;width:15%;height:43%;background:#916b48;border:7px solid #72583f}
.cabinet{position:absolute;left:18%;top:40%;width:9%;height:23%;background:#bfc7c6;border:3px solid #7c8583}
.desk{position:absolute;width:24%;height:12%;background:#b98e60;border:3px solid #765638}
.d1{left:5%;bottom:22%}.d2{left:35%;bottom:12%}.d3{right:16%;bottom:20%}
.hotspot{position:absolute;width:36px;height:36px;border-radius:50%;background:#e5b75d;border:2px solid white;cursor:pointer;font-weight:bold}
.hs-board{left:43%;top:35%}.hs-cab{left:19%;top:45%}.hs-desk{left:25%;bottom:28%}.hs-door{right:7%;top:45%}.hs-bin{right:25%;top:60%}
.panel{background:#203440;border:1px solid #607987;border-radius:10px;padding:16px;margin-bottom:12px}
.paper{background:#f5f1e8;color:#172733;border-radius:8px;padding:14px;line-height:1.7}
button{cursor:pointer;border:0;border-radius:7px;padding:10px;background:#e5b75d;font-weight:bold;margin:4px}
input{padding:11px;width:65%;max-width:100%;box-sizing:border-box}
#feedback{color:#f2cf7c;min-height:25px}
#items span{display:inline-block;background:#314c5a;padding:8px;margin:4px;border-radius:5px}
@media(max-width:750px){main{grid-template-columns:1fr}.scene{height:380px}}
</style>
</head>
<body>
<header><strong>🚪 교실 탈출하기</strong><span id="progress">현재 단계 : 1 / 5</span><button onclick="restart()">다시 시작</button></header>
<main>
<section>
<div class="scene">
<div class="window"></div><div class="board">오늘도 행복한 하루</div><div class="cabinet"></div><div class="door"></div>
<div class="desk d1"></div><div class="desk d2"></div><div class="desk d3"></div>
<button class="hotspot hs-board" onclick="investigate('board')">?</button>
<button class="hotspot hs-cab" onclick="investigate('cabinet')">?</button>
<button class="hotspot hs-desk" onclick="investigate('desk')">?</button>
<button class="hotspot hs-door" onclick="investigate('door')">?</button>
<button class="hotspot hs-bin" onclick="investigate('bin')">?</button>
</div>
<div class="panel"><h3>🎒 아이템</h3><div id="items">아직 아이템이 없어요</div></div>
</section>
<aside>
<div class="panel"><h3>🔎 조사 기록</h3><div class="paper" id="log">교실에 갇혔어요. ? 표시를 눌러 단서를 찾아보세요!</div><button onclick="hint()">힌트 보기</button></div>
<div class="panel"><h3>🧩 수수께끼</h3><div class="paper"><b id="title">1단계 · 책상 위 물건</b><p id="riddle">나는 물인데 마시면 없어져요. 나는 무엇일까요?</p><input id="answer" placeholder="정답 입력"><button onclick="check()">확인</button><p id="feedback"></p></div></div>
<div class="panel"><b>게임 방법</b><p>1. 물음표를 눌러 사물을 조사합니다.</p><p>2. 수수께끼를 풀어 단서를 얻습니다.</p><p>3. 마지막 문에 비밀번호를 입력합니다.</p></div>
</aside>
</main>
<script>
const puzzles=[
{title:'1단계 · 책상',riddle:'나는 물인데 마시면 없어져요. 나는 무엇일까요?',answers:['물','물한잔','한잔의물'],hint:'목이 마를 때 마시는 것!',obj:'desk',item:'📝 책상 메모',success:'첫 번째 숫자 2를 찾았어요!',clue:'첫 번째 숫자: 2'},
{title:'2단계 · 칠판',riddle:'세상에서 가장 뜨거운 과일은?',answers:['천도복숭아'],hint:'천 도(1000도) + 복숭아!',obj:'board',item:'🧩 칠판 암호',success:'두 번째 숫자 4를 찾았어요!',clue:'두 번째 숫자: 4'},
{title:'3단계 · 사물함',riddle:'남의 입을 통해 퍼지는 말은 무엇일까요?',answers:['소문'],hint:'사람들 사이에서 퍼지는 이야기예요.',obj:'cabinet',item:'🔑 작은 열쇠',success:'작은 열쇠를 찾았어요!',clue:'열쇠 획득'},
{title:'4단계 · 휴지통',riddle:'청소할 때 깨끗하게 해 주지만 쓰면 더러워지는 것은?',answers:['걸레','물걸레'],hint:'바닥을 닦는 청소 도구예요.',obj:'bin',item:'📄 문 옆 쪽지',success:'마지막 숫자 7을 찾았어요!',clue:'세 번째 숫자: 7'},
{title:'5단계 · 잠긴 문',riddle:'앞에서 찾은 숫자 2, 4, 7을 순서대로 입력하세요.',answers:['247'],hint:'책상 → 칠판 → 휴지통 순서예요.',obj:'door',item:'🚪 탈출 성공',success:'비밀번호가 맞아요! 탈출 성공!',clue:'탈출 성공!'}
];
let stage=0,items=[];
const $=id=>document.getElementById(id);
function norm(s){return s.toLowerCase().replace(/[\s.,!?~。]/g,'')}
function investigate(obj){
const p=puzzles[stage];
if(obj==='door'&&stage<4){$('log').textContent='문이 잠겨 있어요. 다른 사물에서 단서를 찾아보세요.';return}
if(obj!==p.obj){$('log').textContent='그 물건도 살펴봤지만 지금 필요한 단서는 아닌 것 같아요.';return}
$('log').textContent=p.title+'을(를) 조사했어요. 수수께끼를 풀어 보세요.';
}
function check(){
const p=puzzles[stage],a=norm($('answer').value);
if(p.answers.map(norm).includes(a)){
if(!items.includes(p.item))items.push(p.item);
$('items').innerHTML=items.map(x=>'<span>'+x+'</span>').join('');
('feedback').textContent=p.success;('log').textContent=p.clue;
if(stage===4){('progress').textContent='탈출성공!';('title').textContent='🎉 탈출 성공';('riddle').textContent='모든단서를찾았어요!';('answer').disabled=true;return}
stage++;$('progress').textContent='현재 단계 : '+(stage+1)+' / 5';
('title').textContent=puzzles[stage].title;('riddle').textContent=puzzles[stage].riddle;$('answer').value='';
}else{$('feedback').textContent='정답이 아니에요. 힌트를 보고 다시 생각해 보세요.'}
}
function hint(){$('log').textContent='💡 힌트: '+puzzles[stage].hint}
function restart(){stage=0;items=[];('items').textContent='아직아이템이없어요';('progress').textContent='현재 단계 : 1 / 5';('title').textContent=puzzles[0].title;('riddle').textContent=puzzles[0].riddle;('answer').disabled=false;('answer').value='';('feedback').textContent='';('log').textContent='교실에 갇혔어요. ? 표시를 눌러 단서를 찾아보세요!'}
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
</script>
</body>
</html>
