<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 경찰관 도심 순찰 게임</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 18px;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h2>경찰 순찰 모드</h2>
        <div>체포한 범인 수: <span id="score">0</span></div>
    </div>
    <div id="instructions">
        이동: <b>W, A, S, D</b> 또는 <b>화살표 키</b> | 마우스 드래그: <b>시점 회전</b>
    </div>

    <!-- Three.js 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 기본 씬 설정
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // 하늘색
        scene.fog = new THREE.Fog(0x87ceeb, 20, 80);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 조명 설정
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // 바닥 (도로 및 바닥판)
        const floorGeometry = new THREE.PlaneGeometry(200, 200);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 도시 건물 생성
        function createCity() {
            const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
            for (let i = 0; i < 60; i++) {
                const height = 10 + Math.random() * 20;
                const buildingMat = new THREE.MeshStandardMaterial({
                    color: Math.random() > 0.5 ? 0x888888 : 0x667788
                });
                const building = new THREE.Mesh(buildingGeo, buildingMat);
                
                let x = (Math.random() - 0.5) * 160;
                let z = (Math.random() - 0.5) * 160;
                // 중앙 시작 지점 비워두기
                if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;

                building.scale.set(8 + Math.random() * 4, height, 8 + Math.random() * 4);
                building.position.set(x, height / 2, z);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
            }
        }
        createCity();

        // 경찰관 캐릭터 생성 (기하학적 도형으로 조합)
        function createPoliceOfficer() {
            const officerGroup = new THREE.Group();

            // 몸통 (경찰 제복)
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.5, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a237e }); // 다크 블루
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.25;
            body.castShadow = true;
            officerGroup.add(body);

            // 머리
            const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.2;
            head.castShadow = true;
            officerGroup.add(head);

            // 경찰모
            const hatCapGeo = new THREE.CylinderGeometry(0.45, 0.4, 0.2, 8);
            const hatMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
            const hatCap = new THREE.Mesh(hatCapGeo, hatMat);
            hatCap.position.y = 2.5;
            officerGroup.add(hatCap);

            const hatVisorGeo = new THREE.BoxGeometry(0.5, 0.05, 0.3);
            const hatVisor = new THREE.Mesh(hatVisorGeo, hatMat);
            hatVisor.position.set(0, 2.45, 0.25);
            officerGroup.add(hatVisor);

            return officerGroup;
        }

        const player = createPoliceOfficer();
        scene.add(player);

        // 도망치는 용의자 NPC 생성
        let suspects = [];
        let score = 0;

        function createSuspect() {
            const suspectGroup = new THREE.Group();
            
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.4, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xb71c1c }); // 빨간색 옷
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.2;
            body.castShadow = true;
            suspectGroup.add(body);

            const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.1;
            head.castShadow = true;
            suspectGroup.add(head);

            // 랜덤 위치에 배치
            const angle = Math.random() * Math.PI * 2;
            const dist = 15 + Math.random() * 25;
            suspectGroup.position.set(
                player.position.x + Math.sin(angle) * dist,
                0,
                player.position.z + Math.cos(angle) * dist
            );

            scene.add(suspectGroup);
            suspects.push(suspectGroup);
        }

        // 초기 용의자 3명 생성
        for (let i = 0; i < 3; i++) createSuspect();

        // 조작 조작 상태
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (key === 's' || e.key === 'ArrowDown') keys.s = true;
            if (key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (key === 'd' || e.key === 'ArrowRight') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (key === 's' || e.key === 'ArrowDown') keys.s = false;
            if (key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (key === 'd' || e.key === 'ArrowRight') keys.d = false;
        });

        // 카메라 시점 조작 (마우스 드래그)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngleY = 0;

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            cameraAngleY -= deltaX * 0.005;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // 메인 게임 루프
        const speed = 0.15;
        function animate() {
            requestAnimationFrame(animate);

            // 이동 벡터 계산
            let moveX = 0;
            let moveZ = 0;

            if (keys.w) moveZ -= 1;
            if (keys.s) moveZ += 1;
            if (keys.a) moveX -= 1;
            if (keys.d) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                // 카메라 방향 기준으로 플레이어 이동
                const moveVector = new THREE.Vector3(moveX, 0, moveZ).normalize();
                moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngleY);

                player.position.x += moveVector.x * speed;
                player.position.z += moveVector.z * speed;

                // 이동 방향으로 캐릭터 회전
                const targetAngle = Math.atan2(moveVector.x, moveVector.z);
                player.rotation.y = targetAngle;
            }

            // 카메라가 플레이어를 추적 (3인칭 시점)
            const cameraDistance = 8;
            const cameraHeight = 5;
            camera.position.x = player.position.x + Math.sin(cameraAngleY) * cameraDistance;
            camera.position.z = player.position.z + Math.cos(cameraAngleY) * cameraDistance;
            camera.position.y = player.position.y + cameraHeight;
            camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);

            // 용의자 AI 및 체포 판정
            suspects.forEach((suspect, index) => {
                // 경찰관과의 거리 계산
                const dist = player.position.distanceTo(suspect.position);

                // 경찰관과 가까워지면 반대 방향으로 도망
                if (dist < 10) {
                    const runDir = new THREE.Vector3()
                        .subVectors(suspect.position, player.position)
                        .normalize();
                    suspect.position.x += runDir.x * 0.08;
                    suspect.position.z += runDir.z * 0.08;
                    suspect.rotation.y = Math.atan2(runDir.x, runDir.z);
                }

                // 일정 거리 이내에 접근하면 체포 처리
                if (dist < 1.5) {
                    scene.remove(suspect);
                    suspects.splice(index, 1);
                    score += 1;
                    document.getElementById('score').innerText = score;
                    
                    // 새 용의자 생성
                    setTimeout(createSuspect, 2000);
                }
            });

            renderer.render(scene, camera);
        }

        // 창 크기 조절 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
