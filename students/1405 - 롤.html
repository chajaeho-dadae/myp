<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ARAM 듀얼 프로토타입</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0f24;color:#fff;user-select:none;
  font-family:'Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{pointer-events:none}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.panel{width:250px;background:rgba(10,16,38,.72);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
.panel .nm{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;font-weight:600}
.bar{position:relative;height:12px;background:rgba(0,0,0,.55);border-radius:6px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:6px}
.bar b{position:absolute;inset:0;font-size:10px;line-height:12px;text-align:center;font-weight:600;text-shadow:0 0 3px #000}
.hp i{background:linear-gradient(#5be37d,#2fb457)}
.panel.right .hp i{background:linear-gradient(#ff8080,#d63a3a)}
.mp i{background:linear-gradient(#6fb6ff,#2f6fe0)}
.xp i{background:linear-gradient(#e6c35a,#b8902a)}
#center{text-align:center;text-shadow:0 2px 6px #000}
#score{font-size:34px;font-weight:800;letter-spacing:4px}
#timer{font-size:16px;opacity:.9}
#timer.warn{color:#ff7070}
#roundlbl{font-size:12px;opacity:.7;letter-spacing:2px}
#bottom{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#skills{display:flex;gap:10px}
.skill{position:relative;width:66px;height:66px;border-radius:10px;background:rgba(10,16,38,.82);border:2px solid rgba(255,255,255,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.skill .k{position:absolute;top:3px;left:6px;font-size:13px;font-weight:800;color:#ffd96a}
.skill .n{font-size:11px;margin-top:10px;text-align:center;line-height:1.2;padding:0 2px}
.skill .cdov{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.7)}
.skill .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;text-shadow:0 0 4px #000}
.skill.nomana{border-color:#3b6bd6}
.skill.locked{opacity:.5}
#bars{width:300px;display:flex;flex-direction:column;gap:3px}
#hint{position:fixed;right:14px;bottom:14px;font-size:12px;line-height:1.7;opacity:.75;text-align:right;
  background:rgba(10,16,38,.6);padding:8px 12px;border-radius:8px;pointer-events:none}
#msg{position:fixed;top:26%;left:0;right:0;text-align:center;font-size:58px;font-weight:800;
  text-shadow:0 3px 12px #000;pointer-events:none;display:none}
#msg small{display:block;font-size:20px;font-weight:500;opacity:.85;margin-top:6px}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,20,.75);z-index:10}
#overlay .card{width:min(460px,90vw);background:#121a3a;border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:28px 30px;text-align:center}
#overlay h1{font-size:26px;margin-bottom:6px}
#overlay p{font-size:14px;opacity:.85;line-height:1.7;margin:6px 0}
#overlay ul{list-style:none;text-align:left;margin:14px auto;font-size:14px;line-height:1.9;width:fit-content}
#overlay button{margin-top:14px;padding:11px 30px;font-size:16px;font-weight:700;border:0;border-radius:10px;
  background:linear-gradient(#ffd96a,#e0a82a);color:#241a00;cursor:pointer}
#overlay button:hover{filter:brightness(1.08)}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>

<div id="top">
  <div class="panel left">
    <div class="nm"><span>번개 마법사 (나)</span><span id="pl">Lv1</span></div>
    <div class="bar hp"><i id="phb"></i><b id="pht"></b></div>
  </div>
  <div id="center">
    <div id="roundlbl">ROUND 1 · 3판 2선승</div>
    <div id="score">0 : 0</div>
    <div id="timer">2:30</div>
  </div>
  <div class="panel right">
    <div class="nm"><span>냉기 마법사 (봇)</span><span id="bl">Lv1</span></div>
    <div class="bar hp"><i id="bhb"></i><b id="bht"></b></div>
  </div>
</div>

<div id="bottom">
  <div id="skills"></div>
  <div id="bars">
    <div class="bar hp"><i id="hb"></i><b id="ht"></b></div>
    <div class="bar mp"><i id="mb"></i><b id="mt"></b></div>
    <div class="bar xp" style="height:8px"><i id="xb"></i></div>
  </div>
</div>

<div id="hint">우클릭: 이동 / 공격 (적 위 우클릭)<br>Q W E R: 스킬 (마우스 방향)<br>S: 정지</div>
<div id="msg"></div>

<div id="overlay">
  <div class="card" id="card"></div>
</div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   상수 / 유틸
   - 시뮬레이션 좌표: u = 다리 축(좌하단 기지 0 → 우상단 기지 L), v = 다리 폭 방향
   - 월드 좌표: x = u - L/2, z = v
   ===================================================================== */
const L = 56, HALF = 5.0, CX = L / 2;
const TOWER_RANGE = 7.5, ROUND_TIME = 150, WAVE_INT = 25;
const TEAM_COL = [0x4aa3ff, 0xff5a5a];
const XP_NEXT = [60, 150, 270, 420, 600];
const MAX_LVL = 6;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.u - b.u, a.v - b.v);
const $ = id => document.getElementById(id);

/* =====================================================================
   챔피언 정의
   ===================================================================== */
const DEFS = {
  lightning: {
    name: '번개 마법사', body: 0x6a4bd6, hat: 0xffd23f, orb: 0xffe45c,
    skills: [
      { key: 'Q', name: '연쇄 번개', type: 'chain', cd: 4.5, mana: 40, range: 14, speed: 26, radius: 0.8, dmg: 70, bounces: 2, bounceR: 6, bounceMul: 0.7, color: 0xffe45c },
      { key: 'W', name: '전기 방어막', type: 'shield', cd: 14, mana: 50, shield: 140, dur: 3, haste: 0.3 },
      { key: 'E', name: '번개 점멸', type: 'blink', cd: 9, mana: 35, range: 6, empower: 55 },
      { key: 'R', name: '낙뢰', type: 'strike', cd: 40, mana: 100, range: 15, radius: 3.2, delay: 1.0, dmg: 250, stun: 0.7, lvl: 3, color: 0xfff08a },
    ],
  },
  frost: {
    name: '냉기 마법사', body: 0x3f9fd6, hat: 0xeaf8ff, orb: 0x9ff0ff,
    skills: [
      { key: 'Q', name: '얼음창', type: 'lance', cd: 5, mana: 40, range: 15, speed: 20, radius: 0.8, dmg: 65, pierce: true, slow: 0.35, slowDur: 1.6, color: 0xb8f3ff },
      { key: 'W', name: '서리 장판', type: 'zone', cd: 14, mana: 60, range: 12, radius: 3.5, dur: 3, slow: 0.45, dps: 28, color: 0x9fe8ff },
      { key: 'E', name: '후퇴 점멸', type: 'blink', cd: 10, mana: 35, range: 6 },
      { key: 'R', name: '절대영도', type: 'nova', cd: 45, mana: 100, radius: 5, delay: 0.6, dmg: 170, stun: 1.4, lvl: 3, color: 0xcff6ff },
    ],
  },
};

/* =====================================================================
   게임 상태
   ===================================================================== */
const G = {
  state: 'menu',       // menu | countdown | play | roundEnd | matchEnd
  t: 0, roundT: 0, stateT: 0, timeScale: 1,
  round: 1, score: [0, 0], lastWinner: -1,
  units: [], projs: [], aoes: [], zones: [], fx: [], texts: [], spawnQ: [],
  nextWaveT: 6, nextId: 1, shake: 0, player: null, bot: null,
};

/* =====================================================================
   Three.js 기본 설정 (고정 사선 카메라)
   ===================================================================== */
const glCanvas = $('gl'), uiCanvas = $('ui');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0f24);
scene.fog = new THREE.Fog(0x0a0f24, 110, 230);

const PITCH = 45 * Math.PI / 180, CAM_D = 100;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 400);
const camBase = new THREE.Vector3(-0.7071 * Math.cos(PITCH) * CAM_D, Math.sin(PITCH) * CAM_D, 0.7071 * Math.cos(PITCH) * CAM_D);
camera.position.copy(camBase);
camera.lookAt(0, 0, 0);
camera.updateMatrixWorld();

let W = 1280, H = 720;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  const aspect = W / H;
  const halfH = Math.max(21, 30 / aspect);
  camera.left = -halfH * aspect; camera.right = halfH * aspect;
  camera.top = halfH - 1.6; camera.bottom = -halfH - 1.6;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  uiCanvas.width = W * dpr; uiCanvas.height = H * dpr;
  uiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const uiCtx = uiCanvas.getContext('2d');
window.addEventListener('resize', resize);

/* ---------- 재질/지오메트리 캐시 ---------- */
const matCache = new Map();
function lam(c) {
  const k = 'l' + c;
  if (!matCache.has(k)) { const m = new THREE.MeshLambertMaterial({ color: c, flatShading: true }); m.userData.shared = true; matCache.set(k, m); }
  return matCache.get(k);
}
function bas(c) {
  const k = 'b' + c;
  if (!matCache.has(k)) { const m = new THREE.MeshBasicMaterial({ color: c }); m.userData.shared = true; matCache.set(k, m); }
  return matCache.get(k);
}
function ownMat(c, op) {
  const m = new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide });
  m.userData.own = true; return m;
}
function disposeOwn(obj) {
  obj.traverse(o => { if (o.material && o.material.userData && o.material.userData.own) o.material.dispose(); });
}
const gSphere = new THREE.SphereGeometry(1, 12, 8);
const gBox = new THREE.BoxGeometry(1, 1, 1);
const gRing = new THREE.RingGeometry(0.92, 1, 44); gRing.rotateX(-Math.PI / 2);
const gDisc = new THREE.CircleGeometry(1, 44); gDisc.rotateX(-Math.PI / 2);
const gCyl = new THREE.CylinderGeometry(1, 1, 1, 5);
const UP = new THREE.Vector3(0, 1, 0);
const w = (u, y = 0) => new THREE.Vector3(u.u - CX, y, u.v);

/* =====================================================================
   월드 구성
   ===================================================================== */
function buildWorld() {
  scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x20263f, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(-30, 60, 20); scene.add(sun);

  const bl = L + 8;
  const deck = new THREE.Mesh(new THREE.BoxGeometry(bl, 1.2, HALF * 2 + 1), lam(0x5b6785)); deck.position.set(0, -0.6, 0); scene.add(deck);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(bl, 0.02, 1.2), lam(0x7e8bb0)); stripe.position.y = 0.011; scene.add(stripe);
  for (let x = -bl / 2 + 2; x < bl / 2; x += 4) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.02, HALF * 2 + 1), lam(0x6c7aa0)); t.position.set(x, 0.012, 0); scene.add(t);
  }
  for (const s of [-1, 1]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(bl, 0.7, 0.5), lam(0x8d9bc2)); rail.position.set(0, 0.35, s * (HALF + 0.75)); scene.add(rail);
  }
  for (const team of [0, 1]) {
    const cx = (team === 0 ? 3 : L - 3) - CX;
    const plat = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.2, 1.2, 32), lam(team === 0 ? 0x2a4a80 : 0x80302f));
    plat.position.set(cx, -0.6 + 0.02, 0); scene.add(plat);
    const glow = new THREE.Mesh(new THREE.TorusGeometry(5.3, 0.12, 6, 40), bas(TEAM_COL[team]));
    glow.rotation.x = Math.PI / 2; glow.position.set(cx, 0.05, 0); scene.add(glow);
  }
  for (const x of [-22, -8, 6, 20]) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.8, 18, 8), lam(0x3a4466)); p.position.set(x, -10, 0); scene.add(p);
  }
  // 별
  const sp = [];
  for (let i = 0; i < 420; i++) sp.push(rand(-130, 130), rand(-15, 50), rand(-130, 130));
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xaecbff, size: 2, sizeAttenuation: false })));
  // 떠다니는 바위
  G.rocks = [];
  for (let i = 0; i < 14; i++) {
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(rand(1, 3), 0), lam(0x2c3552));
    const side = Math.random() < 0.5 ? -1 : 1;
    r.position.set(rand(-34, 34), rand(-14, -3), side * rand(10, 26));
    r.rotation.set(rand(0, 3), rand(0, 3), 0); scene.add(r); G.rocks.push(r);
  }
}

/* =====================================================================
   이펙트
   ===================================================================== */
function particleUpd(f, k, dt) {
  const p = f.mesh.position;
  p.x += f.vx * dt; p.y += f.vy * dt; p.z += f.vz * dt; f.vy -= 9 * dt;
  f.mesh.scale.setScalar(Math.max(0.001, f.size * (1 - k)));
}
function burst(x, y, z, color, n = 8, spd = 4, life = 0.5, size = 0.18) {
  if (G.fx.length > 500) return;
  const m = bas(color);
  for (let i = 0; i < n; i++) {
    const mesh = new THREE.Mesh(gBox, m); mesh.position.set(x, y, z); mesh.scale.setScalar(size); scene.add(mesh);
    const a = rand(0, 6.283), e = rand(-0.2, 1), sp = rand(0.4, 1) * spd;
    G.fx.push({ mesh, life: life * rand(0.6, 1), max: life, vx: Math.cos(a) * sp, vy: Math.abs(e) * sp + 1, vz: Math.sin(a) * sp, size, upd: particleUpd });
  }
}
function ringFx(u, v, r0, r1, color, life, y = 0.06) {
  const mat = ownMat(color, 0.9);
  const mesh = new THREE.Mesh(gRing, mat); mesh.position.set(u - CX, y, v); mesh.scale.set(r0, 1, r0); scene.add(mesh);
  G.fx.push({ mesh, life, max: life, upd: (f, k) => { const r = r0 + (r1 - r0) * k; f.mesh.scale.set(r, 1, r); mat.opacity = 0.9 * (1 - k); } });
}
function bolt(a, b, color, life) {
  const g = new THREE.Group(), m = ownMat(color, 1);
  const pts = [a.clone()], dir = b.clone().sub(a), n = 6;
  for (let i = 1; i < n; i++) {
    const p = a.clone().addScaledVector(dir, i / n);
    p.x += rand(-0.35, 0.35); p.y += rand(-0.35, 0.35); p.z += rand(-0.35, 0.35); pts.push(p);
  }
  pts.push(b.clone());
  for (let i = 0; i < pts.length - 1; i++) {
    const s = pts[i], e = pts[i + 1], d = e.clone().sub(s), len = d.length();
    const seg = new THREE.Mesh(gCyl, m);
    seg.position.copy(s).addScaledVector(d, 0.5);
    seg.quaternion.setFromUnitVectors(UP, d.normalize());
    seg.scale.set(0.09, len, 0.09); g.add(seg);
  }
  scene.add(g);
  G.fx.push({ mesh: g, life, max: life, upd: (f, k) => { m.opacity = 1 - k; } });
}
function updateFx(dt) {
  for (const f of G.fx) {
    f.life -= dt;
    f.upd(f, clamp(1 - f.life / f.max, 0, 1), dt);
    if (f.life <= 0) { scene.remove(f.mesh); disposeOwn(f.mesh); f.done = true; }
  }
  G.fx = G.fx.filter(f => !f.done);
}
function addText(u, v, str, color = '#fff', size = 16, y = 2.8) {
  G.texts.push({ u, v, y, str, color, size, life: 0.9, max: 0.9 });
}

/* =====================================================================
   모델
   ===================================================================== */
function makeChampMesh(def, team) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.62, 1.5, 8), lam(def.body)); body.position.y = 0.75; g.add(body);
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.32, 0), lam(0xffd9b0)); head.position.y = 1.7; g.add(head);
  const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.06, 10), lam(def.hat)); brim.position.y = 1.92; g.add(brim);
  const hat = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.8, 6), lam(def.hat)); hat.position.y = 2.3; hat.rotation.z = 0.15; g.add(hat);
  const staff = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.0, 6), lam(0x6b4a2b)); staff.position.set(0.15, 1.0, 0.65); g.add(staff);
  const orb = new THREE.Mesh(new THREE.IcosahedronGeometry(0.22, 1), bas(def.orb)); orb.position.set(0.15, 2.1, 0.65); g.add(orb);
  const ring = new THREE.Mesh(gRing, ownMat(TEAM_COL[team], 0.95)); ring.scale.set(1.15, 1, 1.15); ring.position.y = 0.04; g.add(ring);
  const sh = new THREE.Mesh(gSphere, ownMat(0x9fd8ff, 0.28)); sh.scale.setScalar(1.3); sh.position.y = 1.2; sh.visible = false; g.add(sh);
  const stun = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.06, 5, 14), bas(0xffe45c)); stun.rotation.x = Math.PI / 2; stun.position.y = 2.9; stun.visible = false; g.add(stun);
  g.userData = { orb, shield: sh, stun };
  return g;
}
function makeMinionMesh(type, team) {
  const g = new THREE.Group();
  const col = team === 0 ? 0x4f9cff : 0xff6060;
  if (type === 'melee') {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.46, 0.9, 8), lam(col)); b.position.y = 0.45; g.add(b);
    const h = new THREE.Mesh(gSphere, lam(0xf2d0a4)); h.scale.setScalar(0.28); h.position.y = 1.08; g.add(h);
    const sw = new THREE.Mesh(gBox, lam(0xd8dde8)); sw.scale.set(0.1, 0.8, 0.1); sw.position.set(0.45, 0.75, 0); g.add(sw);
  } else {
    const b = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.0, 7), lam(col)); b.position.y = 0.5; g.add(b);
    const h = new THREE.Mesh(gSphere, lam(0xf2d0a4)); h.scale.setScalar(0.26); h.position.y = 1.15; g.add(h);
    const o = new THREE.Mesh(gSphere, bas(TEAM_COL[team])); o.scale.setScalar(0.14); o.position.set(0.4, 0.9, 0.2); g.add(o);
  }
  return g;
}
function makeTowerMesh(team) {
  const g = new THREE.Group();
  const col = team === 0 ? 0x3d5f9c : 0x9c3d3d;
  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.7, 0.8, 8), lam(0x4a5472)); base.position.y = 0.4; g.add(base);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.1, 3.4, 8), lam(col)); shaft.position.y = 2.5; g.add(shaft);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.0, 0.5, 8), lam(0x4a5472)); top.position.y = 4.4; g.add(top);
  const cr = new THREE.Mesh(new THREE.OctahedronGeometry(0.7, 0), bas(TEAM_COL[team])); cr.position.y = 5.4; g.add(cr);
  const rg = new THREE.Mesh(gRing, ownMat(TEAM_COL[team], 0.22)); rg.scale.set(TOWER_RANGE, 1, TOWER_RANGE); rg.position.y = 0.03; g.add(rg);
  g.userData = { crystal: cr };
  return g;
}

/* =====================================================================
   유닛 생성
   ===================================================================== */
function baseUnit(kind, team, u, v, radius, maxHp) {
  return {
    id: G.nextId++, kind, team, u, v, pu: u, pv: v, vu: 0, vv: 0, face: team === 0 ? 0 : Math.PI,
    radius, hp: maxHp, maxHp, dead: false, slow: null, haste: null, shield: null, stunUntil: 0, flash: 0,
    mesh: null, attackTarget: null, moveTarget: null, soft: false, nextAtk: 0, baseMs: 3.4,
  };
}
function computeStats(c, init) {
  const l = c.level, old = c.maxHp || 0;
  c.maxHp = 620 + 85 * (l - 1); c.maxMana = 300 + 35 * (l - 1);
  c.power = 1 + 0.14 * (l - 1); c.ad = 46 + 5 * (l - 1); c.as = 0.85 + 0.03 * (l - 1);
  if (!init) { c.hp += c.maxHp - old; c.mana = Math.min(c.maxMana, c.mana + 35); }
}
function makeChamp(key, team) {
  const def = DEFS[key];
  const c = baseUnit('champ', team, team === 0 ? 4 : L - 4, 0, 0.7, 1);

    if (dist(tw, tg) > TOWER_RANGE + tg.radius) { tw.target = null; return; }
    tw.nextAtk = t + 1.1;
    if (tw.lastTarget === tg) tw.stack = Math.min(4, tw.stack + 1); else tw.stack = 0;
    tw.lastTarget = tg;
    const dmg = tg.kind === 'minion' ? 130 : 65 * (1 + 0.3 * tw.stack);
    const p = { u: tw.u, v: tw.v, face: Math.atan2(tg.v - tw.v, tg.u - tw.u), team: tw.team, kind: 'tower' };
    spawnHoming(p, tg, dmg, 22, TEAM_COL[tw.team], 0.38);
    G.projs[G.projs.length - 1].y = 5;
    G.projs[G.projs.length - 1].src = tw;
  }
}

/* =====================================================================
   봇 AI (상태머신: 회피 → 후퇴 → 교전/카이팅 → 파밍)
   ===================================================================== */
function inEnemyTowerRange(b, pt) {
  for (const tw of G.units) {
    if (tw.kind !== 'tower' || tw.dead || tw.team === b.team) continue;
    if (Math.hypot(pt.u - tw.u, pt.v - tw.v) < TOWER_RANGE + 0.8) {
      if (tw.target && tw.target.kind === 'minion' && !tw.target.dead) continue;
      return tw;
    }
  }
  return null;
}
function leadAim(from, tgt, speed) {
  let ax = tgt.u, az = tgt.v;
  for (let i = 0; i < 2; i++) {
    const tt = Math.hypot(ax - from.u, az - from.v) / speed;
    ax = tgt.u + tgt.vu * tt * 0.85; az = tgt.v + tgt.vv * tt * 0.85;
  }
  return { u: ax + rand(-0.35, 0.35), v: az + rand(-0.35, 0.35) };
}
function setDodge(b, u, v, dur) {
  b.moveTarget = { u: clamp(u, -1, L + 1), v: clamp(v, -HALF, HALF) };
  b.attackTarget = null; b.dodgeUntil = G.t + dur;
}
function botThink(b) {
  const t = G.t, p = G.player;
  if (b.dead || !p || p.dead || G.state !== 'play') return;
  b.soft = true;
  const dP = Math.max(0.01, dist(b, p)), hpR = b.hp / b.maxHp;
  const dirx = (b.u - p.u) / dP, dirz = (b.v - p.v) / dP;     // 플레이어 → 봇 방향

  // 1) 스킬 회피 (반응 지연 0.22초 + 55% 확률)
  if (t >= b.dodgeUntil) {
    for (const pr of G.projs) {
      if (pr.kind !== 'shot' || pr.team === b.team || t - pr.born < 0.22) continue;
      const rx = b.u - pr.u, rz = b.v - pr.v, along = rx * pr.dx + rz * pr.dz;
      if (along < 0 || along > pr.left) continue;
      const cross = rx * pr.dz - rz * pr.dx, need = pr.r + b.radius + 0.35;
      if (Math.abs(cross) < need && along / pr.speed < 0.9) {
        if (pr.roll === undefined) pr.roll = Math.random() < 0.55;
        if (pr.roll) {
          const sg = Math.abs(cross) < 0.05 ? (Math.random() < 0.5 ? 1 : -1) : Math.sign(cross);
          const amt = need - Math.abs(cross) + 1.0;
          setDodge(b, b.u + pr.dz * sg * amt, b.v - pr.dx * sg * amt, 0.5); break;
        }
      }
    }
  }
  if (t >= b.dodgeUntil) {
    for (const a of G.aoes) {
      if (a.team === b.team || t - a.born < 0.25) continue;
      const d = Math.hypot(b.u - a.u, b.v - a.v);
      if (d < a.radius + 0.2) {
        if (a.roll === undefined) a.roll = Math.random() < 0.7;
        if (a.roll) {
          let dx = b.u - a.u, dz = b.v - a.v; const dd = Math.hypot(dx, dz);
          if (dd < 0.01) { dx = 1; dz = 0; } else { dx /= dd; dz /= dd; }
          const out = { u: a.u + dx * (a.radius + 1.4), v: a.v + dz * (a.radius + 1.4) };
          if (a.at - t < 0.4 && canCast(b, 2)) cast(b, 2, out);
          setDodge(b, out.u, out.v, 0.7); break;
        }
      }
    }
  }
  if (t < b.dodgeUntil) return;

  // 2) 후퇴 (체력 32% 미만 → 80% 이상이 될 때까지 기지에서 회복)
  if (hpR < 0.32) b.retreating = true; else if (hpR > 0.8) b.retreating = false;
  if (b.retreating) {
    b.attackTarget = null; b.moveTarget = { u: L - 3, v: 0 };
    if (dP < 6 && canCast(b, 2)) cast(b, 2, { u: b.u + 6, v: b.v + rand(-2, 2) });
    else if (dP < 11 && canCast(b, 1)) cast(b, 1, leadAim(b, p, 99));
    else if (dP < 14 && canCast(b, 0)) cast(b, 0, leadAim(b, p, b.def.skills[0].speed));
    return;
  }

  // 3) 타워 사거리 안이면 벗어난다
  const tw = inEnemyTowerRange(b, b);
  if (tw) {
    const dx = b.u - tw.u, dz = b.v - tw.v, d = Math.hypot(dx, dz) || 1;
    b.attackTarget = null;
    b.moveTarget = { u: tw.u + dx / d * (TOWER_RANGE + 2), v: tw.v + dz / d * (TOWER_RANGE + 2) };
    return;
  }

  // 4) 교전 (카이팅 + 스킬)
  if (dP < 15) {
    const qs = b.def.skills[0];
    if (dP < 4.6 && canCast(b, 3)) cast(b, 3, b);
    else if (dP < 3.2 && hpR < 0.65 && canCast(b, 2)) cast(b, 2, { u: b.u + dirx * 6, v: b.v + dirz * 6 });
    else if (dP < 14.3 && canCast(b, 0)) cast(b, 0, leadAim(b, p, qs.speed));
    else if (dP < 11.5 && canCast(b, 1)) cast(b, 1, leadAim(b, p, 99));

    if (t >= b.nextStrafe) { b.strafeUntil = t + rand(0.4, 0.8); b.nextStrafe = t + rand(1.4, 2.4); b.strafeDir = Math.random() < 0.5 ? 1 : -1; }
    const ready = canCast(b, 0) || canCast(b, 1);
    const want = ready ? 8.2 : 6.0;
    let mt = null, at = null;
    if (dP < want - 1.3) mt = { u: b.u + dirx * 3, v: b.v + dirz * 3 };
    else if (dP > want + 1.2) mt = { u: p.u + dirx * want, v: p.v + dirz * want };
    else if (t < b.strafeUntil) mt = { u: b.u - dirz * b.strafeDir * 2.2, v: b.v + dirx * b.strafeDir * 2.2 };
    else if (dP <= b.range + p.radius + 0.2) at = p;
    if (mt && inEnemyTowerRange(b, mt)) mt = null;
    if (mt) { b.moveTarget = mt; b.attackTarget = null; }
    else { b.moveTarget = null; b.attackTarget = at; }
    return;
  }

  // 5) 파밍 / 대기
  let tgt = null, bd = b.range + 1.0;
  for (const e of G.units) {
    if (e.dead || e.team === b.team || e.kind !== 'minion') continue;
    const d = dist(b, e); if (d < bd) { bd = d; tgt = e; }
  }
  if (tgt) { b.attackTarget = tgt; b.moveTarget = null; return; }
  if (t > b.nextLane) { b.laneV = rand(-2.5, 2.5); b.nextLane = t + 4; }
  let standU = L - 18, fm = null;
  for (const m of G.units) if (m.kind === 'minion' && !m.dead && m.team === b.team && (!fm || m.u < fm.u)) fm = m;
  if (fm) standU = fm.u + 3.0;
  for (const e of G.units) if (e.kind === 'tower' && !e.dead && e.team !== b.team) standU = Math.max(standU, e.u + TOWER_RANGE + 1.2);
  standU = Math.min(standU, L - 8);
  const stand = { u: standU, v: b.laneV };
  b.attackTarget = null;
  b.moveTarget = dist(b, stand) > 1.5 ? stand : null;
}

/* =====================================================================
   라운드 / 매치 흐름
   ===================================================================== */
let msgToken = 0;
function showMsg(html, ms) {
  const el = $('msg');
  if (el.innerHTML !== html) el.innerHTML = html;
  el.style.display = 'block';
  if (ms) { const tk = ++msgToken; setTimeout(() => { if (tk === msgToken) el.style.display = 'none'; }, ms); }
  else msgToken++;
}
function hideMsg() { msgToken++; $('msg').style.display = 'none'; }

function clearWorldObjects() {
  for (const u of G.units) { scene.remove(u.mesh); disposeOwn(u.mesh); }
  for (const p of G.projs) scene.remove(p.mesh);
  for (const a of G.aoes) { scene.remove(a.mesh); disposeOwn(a.mesh); }
  for (const z of G.zones) { scene.remove(z.mesh); disposeOwn(z.mesh); }
  for (const f of G.fx) { scene.remove(f.mesh); disposeOwn(f.mesh); }
  G.units = []; G.projs = []; G.aoes = []; G.zones = []; G.fx = []; G.texts = []; G.spawnQ = [];
}
function resetRound() {
  clearWorldObjects();
  G.player = makeChamp('lightning', 0);
  G.bot = makeChamp('frost', 1);
  makeTower(0, 9); makeTower(0, 18); makeTower(1, L - 9); makeTower(1, L - 18);
  G.t = 0; G.roundT = 0; G.nextWaveT = 6; G.stateT = 0; G.timeScale = 1;
  G.state = 'countdown';
}
function startMatch() {
  G.score = [0, 0]; G.round = 1; G.lastWinner = -1;
  $('overlay').style.display = 'none';
  hideMsg(); resetRound();
}
function endRound(winner) {
  if (G.state !== 'play') return;
  G.state = 'roundEnd'; G.stateT = 0; G.timeScale = 0.25; G.lastWinner = winner;
  if (winner >= 0) G.score[winner]++;
  const done = G.score[0] >= 2 || G.score[1] >= 2;
  if (winner === 0) showMsg('라운드 승리!' + (done ? '' : '<small>다음 라운드 준비 중…</small>'));
  else if (winner === 1) showMsg('라운드 패배' + (done ? '' : '<small>다음 라운드 준비 중…</small>'));
  else showMsg('무승부<small>라운드를 다시 시작합니다</small>');
}
function timeUp() {
  const p = G.player, b = G.bot, a = p.hp / p.maxHp, c = b.hp / b.maxHp;
  endRound(Math.abs(a - c) < 0.001 ? -1 : a > c ? 0 : 1);
}
function finishMatch() {
  G.state = 'matchEnd'; hideMsg();
  const win = G.score[0] > G.score[1];
  $('card').innerHTML = `<h1>${win ? '🏆 매치 승리!' : '💀 매치 패배'}</h1><p>최종 스코어 ${G.score[0]} : ${G.score[1]}</p>
    <button id="again">다시 하기</button>`;
  $('overlay').style.display = 'flex';
  $('again').onclick = startMatch;
}
function processWaves() {
  if (G.roundT >= G.nextWaveT) {
    G.nextWaveT += WAVE_INT;
    for (let i = 0; i < 4; i++) for (const team of [0, 1]) G.spawnQ.push({ at: G.roundT + i * 0.8, type: i < 3 ? 'melee' : 'ranged', team });
  }
  while (G.spawnQ.length && G.spawnQ[0].at <= G.roundT) { const s = G.spawnQ.shift(); spawnMinion(s.type, s.team); }
}

function simulate(dt) {
  G.t += dt;
  if (G.state === 'play') {
    G.roundT += dt; processWaves();
    if (G.bot && G.t >= G.bot.nextThink) { G.bot.nextThink = G.t + 0.2; botThink(G.bot); }
  }
  for (const u of G.units.slice()) {
    if (u.dead && u.kind !== 'champ') continue;
    if (u.kind === 'champ') updateChamp(u, dt);
    else if (u.kind === 'minion') updateMinion(u, dt);
    else updateTower(u, dt);
  }
  separateMinions();
  // 속도 추적 (예측 사격용)
  for (const u of G.units) {
    if (u.kind !== 'champ' || dt <= 0) continue;
    u.vu += ((u.u - u.pu) / dt - u.vu) * 0.5; u.vv += ((u.v - u.pv) / dt - u.vv) * 0.5; u.pu = u.u; u.pv = u.v;
  }
  updateProjs(dt); updateAoes(); updateZones(dt);
  for (const tx of G.texts) tx.life -= dt;
  G.texts = G.texts.filter(tx => tx.life > 0);
  G.units = G.units.filter(u => {
    if (u.dead && u.kind !== 'champ') { scene.remove(u.mesh); disposeOwn(u.mesh); return false; }
    return true;
  });
  if (G.state === 'play' && G.roundT >= ROUND_TIME) timeUp();
}

const mouse = { ndc: new THREE.Vector2(), ground: { u: CX, v: 0 }, rightHeld: false };
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitV = new THREE.Vector3();
function updateMouse(e) {
  mouse.ndc.set((e.clientX / W) * 2 - 1, -(e.clientY / H) * 2 + 1);
  ray.setFromCamera(mouse.ndc, camera);
  if (ray.ray.intersectPlane(plane, hitV)) { mouse.ground.u = hitV.x + CX; mouse.ground.v = hitV.z; }
}
function pickEnemy(p) {

  for (const e of G.units) {
    if (e.dead || e.team === 0) continue;
    const d = Math.hypot(e.u - p.u, e.v - p.v);
    if (d < e.radius + 0.9 && d < bd) { bd = d; best = e; }
  }
  return best;
}
function rightClick(p) {
  const pl = G.player; if (!pl || pl.dead || G.state !== 'play') return;
  const e = pickEnemy(p);
  if (e) {
    pl.attackTarget = e; pl.soft = false; pl.moveTarget = null; pl.clickMode = 'attack';
    ringFx(e.u, e.v, 1.4, 0.5, 0xff5a5a, 0.4);
  } else {

    ringFx(p.u, p.v, 0.9, 0.25, 0x6dff9a, 0.4);
  }
}
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('pointermove', e => { updateMouse(e); });
window.addEventListener('pointerdown', e => {

window.addEventListener('pointerup', e => { if (e.button === 2) mouse.rightHeld = false; });
const KEYMAP = { KeyQ: 0, KeyW: 1, KeyE: 2, KeyR: 3 };

/* =====================================================================
   렌더링 동기화 / UI
   ===================================================================== */
const _v = new THREE.Vector3();
function syncMeshes(dt) {
  const tm = performance.now() / 1000;
  for (const u of G.units) {
    const m = u.mesh; if (!m) continue;
    u.flash = Math.max(0, u.flash - dt);
    const f = 1 + u.flash * 1.2;
    m.position.set(u.u - CX, 0, u.v);
    m.rotation.y = -u.face;
    m.scale.setScalar(f);
    if (u.kind === 'champ') {
      const d = m.userData;
      if (u.dead) { m.rotation.z = Math.min(1.5, u.deadT * 3); m.position.y = -0.1; }
      else m.position.y = Math.sin(tm * 3 + u.id) * 0.08;
      d.shield.visible = !!(u.shield && u.shield.amt > 0);
      d.stun.visible = !u.dead && G.t < u.stunUntil;
      d.stun.rotation.z = tm * 8;
      d.orb.scale.setScalar(1 + Math.sin(tm * 6) * 0.15);
    } else if (u.kind === 'tower') {
      u.mesh.userData.crystal.rotation.y = tm * 1.5;
      u.mesh.userData.crystal.position.y = 5.4 + Math.sin(tm * 2) * 0.12;
    } else if (u.swing > 0) { u.swing -= dt; m.position.x += Math.cos(u.face) * 0.25; m.position.z += Math.sin(u.face) * 0.25; }
  }
  if (G.rocks) for (const r of G.rocks) { r.rotation.y += dt * 0.1; r.rotation.x += dt * 0.05; }
}
function drawUI() {
  const c = uiCtx; c.clearRect(0, 0, W, H);
  for (const u of G.units) {
    if (u.dead) continue;
    const y = u.kind === 'tower' ? 6.5 : u.kind === 'champ' ? 3.4 : 2.0;
    _v.set(u.u - CX, y, u.v).project(camera);
    const sx = (_v.x * 0.5 + 0.5) * W, sy = (-_v.y * 0.5 + 0.5) * H;
    const bw = u.kind === 'champ' ? 76 : u.kind === 'tower' ? 92 : 34, bh = u.kind === 'minion' ? 5 : 9;
    c.fillStyle = 'rgba(0,0,0,.7)'; c.fillRect(sx - bw / 2 - 1, sy - bh - 1, bw + 2, bh + 2);
    c.fillStyle = u.team === 0 ? '#3fd16a' : '#e04848';
    c.fillRect(sx - bw / 2, sy - bh, bw * clamp(u.hp / u.maxHp, 0, 1), bh);
    if (u.shield && u.shield.amt > 0) {
      c.fillStyle = 'rgba(230,245,255,.9)';
      c.fillRect(sx - bw / 2, sy - bh - 3, bw * clamp(u.shield.amt / u.maxHp, 0, 1), 3);
    }
    if (u.kind === 'champ') {
      c.fillStyle = '#10163a'; c.fillRect(sx - bw / 2 - 18, sy - bh - 1, 16, bh + 2);
      c.fillStyle = '#fff'; c.font = 'bold 10px sans-serif'; c.textAlign = 'center'; c.fillText(String(u.level), sx - bw / 2 - 10, sy - 1);
    }
  }
  c.textAlign = 'center';
  for (const tx of G.texts) {

    c.font = `800 ${tx.size}px sans-serif`; c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,.85)';
    c.strokeText(tx.str, sx, sy); c.fillStyle = tx.color; c.fillText(tx.str, sx, sy);
  }
  c.globalAlpha = 1;
}

/* =====================================================================
   메인 루프
   ===================================================================== */
function step(rdt) {
  G.stateT += rdt;
  if (G.state === 'countdown') {
    if (G.stateT >= 3) { G.state = 'play'; G.stateT = 0; showMsg('시작!', 700); }
    else showMsg(String(Math.ceil(3 - G.stateT)));
  }
  if (G.state === 'play' && mouse.rightHeld && G.player && !G.player.dead && G.player.clickMode === 'move') {
    G.player.moveTarget = { u: clamp(mouse.ground.u, -1, L + 1), v: clamp(mouse.ground.v, -HALF, HALF) };
  }
  if (G.state === 'play' || G.state === 'roundEnd') simulate(rdt * G.timeScale);
  if (G.state === 'roundEnd') {
    if (G.stateT > 1.3) G.timeScale = 1;
    if (G.stateT > 3.8) {
      if (G.score[0] >= 2 || G.score[1] >= 2) finishMatch();
      else { if (G.lastWinner >= 0) G.round++; hideMsg(); resetRound(); }
    }
  }
  updateFx(rdt * G.timeScale);
  syncMeshes(rdt);
  G.shake = Math.max(0, G.shake - rdt * 1.5);
  camera.position.set(camBase.x + rand(-1, 1) * G.shake, camBase.y + rand(-1, 1) * G.shake, camBase.z + rand(-1, 1) * G.shake);
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  step(rdt);
  renderer.render(scene, camera);
  drawUI(); updateHud();
}

/* ---------- 시작 ---------- */
buildWorld();
resize();
resetRound(); G.state = 'menu';
$('card').innerHTML = `<h1>ARAM 듀얼 프로토타입</h1>
  <p>좌하단의 <b>번개 마법사</b>(나) vs 우상단의 <b>냉기 마법사</b>(AI)<br>먼저 상대 챔피언을 처치하면 라운드 승리 · 3판 2선승</p>
  <ul><li>🖱 우클릭: 이동 / 적 위 우클릭: 공격</li><li>⌨ Q W E R: 스킬 (마우스 방향으로 시전)</li>
  <li>⌨ S: 정지 · R은 Lv3 해금</li><li>🧙 미니언을 처치해 경험치(최대 Lv6)를 얻으세요</li>
  <li>🗼 타워는 미니언을 먼저 공격하지만, 적 챔피언을 때리면 어그로가 끌립니다</li></ul>
  <button id="startBtn">게임 시작</button>`;
$('startBtn').onclick = startMatch;
window.__game = { G, mouse, cast, rightClick, step, botThink, startMatch };
requestAnimationFrame(frame);
</script>
