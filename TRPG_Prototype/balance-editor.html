<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>밸런스 에디터</title>
<style>
:root{--bg:#121420;--panel:#191c2b;--panel2:#212539;--line:#2a2f45;--text:#dfe3f0;--mute:#8790ad;--acc:#7f9cff;--mod:#f0b35a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;font-weight:600;margin:0 auto 0 0}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,.item:focus-visible,.sh:focus-visible,#split:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#wrap{flex:1;display:flex;min-height:0}
#side{width:var(--sw,260px);flex:none;overflow:auto;background:var(--panel);padding:8px}
#split{width:6px;flex:none;cursor:col-resize;background:var(--line);touch-action:none}
#split:hover,#split.on{background:var(--acc)}
#main{flex:1;min-width:0;overflow:auto;padding:16px}
.item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--mute);user-select:none}
.item:hover{background:var(--panel2);color:var(--text)}
.item.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--acc)}
.item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{min-width:20px;text-align:center;font-size:12px;border-radius:10px;padding:0 6px;background:var(--mod);color:#2a1d05}
.bd:empty{display:none}
.sep{height:1px;background:var(--line);margin:8px 4px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
.sh:hover{background:var(--panel2)}
.sh .ar{color:var(--mute);transition:transform .15s}
.sec.closed .ar{transform:rotate(-90deg)}
.sh b{font-weight:600}
.sh span{color:var(--mute);font-size:13px;flex:1}
.sb{padding:4px 14px 12px;border-top:1px solid var(--line)}
.sec.closed .sb{display:none}
.row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 84px 28px;gap:12px;align-items:center;padding:6px 0}
.row label{color:var(--mute)}
.row.mod label{color:var(--mod)}
input[type=range]{width:100%;accent-color:var(--acc)}
.row.mod input[type=range]{accent-color:var(--mod)}
.num{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;text-align:right}
.rs{padding:2px 0;visibility:hidden}
.row.mod .rs{visibility:visible}
@media(max-width:640px){.row{grid-template-columns:1fr 84px 28px}.row input[type=range]{grid-column:1/4;grid-row:2}}
</style>
</head>
<body>
<header>
  <h1>밸런스 에디터</h1>
  <button id="bClose">모두 접기</button>
  <button id="bOpen">모두 펼치기</button>
  <button id="bReset">전체 초기화</button>
  <button id="bImp">불러오기</button>
  <button id="bExp">내보내기</button>
  <input id="file" type="file" accept="application/json,.json" hidden>
</header>
<div id="wrap">
  <nav id="side" aria-label="섹션 목록"></nav>
  <div id="split" role="separator" aria-orientation="vertical" tabindex="0" title="드래그해서 사이드바 폭 조절"></div>
  <main id="main"></main>
</div>
<script>
// ---- 변수 정의: [키, 라벨, 최소, 최대, 간격, 기본값] ----
const U=(id,t,hp,atk,def,ap,ini)=>({id,title:t,desc:'유닛 기본 스탯',vars:[
  ['hp','체력',1,300,1,hp],['atk','공격력',0,100,1,atk],['def','방어력',0,100,1,def],
  ['ap','행동 자원',1,12,1,ap],['ini','기본 순서 값',1,99,1,ini]]});
const S=[
 {id:'map',title:'맵과 쿼터뷰',desc:'타일 크기와 투영 비율',vars:[
  ['tile','타일 크기(px)',20,90,1,40],['tilt','세로 압축 비율',0.3,1,0.05,0.5],
  ['cols','맵 가로 칸',6,20,1,11],['rows','맵 세로 칸',5,16,1,9]]},
 {id:'turn',title:'턴과 행동 자원',desc:'순서 값은 낮을수록 먼저 행동',vars:[
  ['trade','행동 강도가 순서 값에 주는 계수',0,5,0.1,1],['ap','기본 행동 자원',1,12,1,6],
  ['mv','이동 1칸 비용',0,3,1,1],['rot','회전 60도 비용',0,3,1,1]]},
 {id:'combo',title:'콤보 규칙',desc:'연쇄 단계와 보너스',vars:[
  ['step','단계당 보너스(%)',0,200,5,25],['decay','같은 레시피 반복 시 보너스 배율',0,1,0.05,0.6],
  ['life','태그 지속(슬롯)',1,3,1,1]]},
 {id:'fx',title:'콤보 연출',desc:'단계가 클수록 커지는 보상 연출',vars:[
  ['t2','2등급 시작 단계',2,10,1,3],['t3','3등급 시작 단계',3,12,1,5],['t4','4등급 시작 단계',4,15,1,7],
  ['shake','화면 흔들림 세기',0,30,1,8],['flash','번쩍임 지속(ms)',0,1000,10,200],
  ['slow','슬로모션 속도 배율',0.1,1,0.05,0.4],['pt','입자 수 배율',0,5,0.1,1]]},
 {id:'ai',title:'적 AI 가중치',desc:'행동 후보 점수에 곱하는 값',vars:[
  ['wDmg','피해량',0,10,0.1,1],['wKill','처치 가능성',0,10,0.1,3],['wRisk','위험 회피',0,10,0.1,1],
  ['wDist','거리',0,10,0.1,0.5],['wCombo','연계 보너스',0,10,0.1,2]]},
 {id:'flee',title:'도망',desc:'도망 결과를 정하는 확률',vars:[
  ['ok','도망 성공 확률(%)',0,100,1,50],['loseU','개체 손실 확률(%)',0,100,1,20],['loseR','자원 손실 확률(%)',0,100,1,30]]},
 U('a1','아군 1 전사',80,12,6,5,50),U('a2','아군 2 궁수',45,10,2,6,40),U('a3','아군 3 마법사',40,14,1,5,60),
 U('e1','적 1 병사',50,8,3,5,55),U('e2','적 2 거구',90,10,5,4,70),U('e3','적 3 사수',35,9,1,5,45),U('e4','적 4 주술사',40,11,2,5,50)
];

// ---- 상태 ----
const $=(t,c,p)=>{const e=document.createElement(t);if(c)e.className=c;if(p)p.append(e);return e};
const V={},D={},bd={};
S.forEach(s=>{V[s.id]={};D[s.id]={};s.vars.forEach(v=>V[s.id][v[0]]=D[s.id][v[0]]=v[5])});
const KEY='hexrpg.balance',SW='hexrpg.sidebarWidth';
function merge(o){S.forEach(s=>s.vars.forEach(v=>{const x=o&&o[s.id]&&o[s.id][v[0]];if(typeof x==='number'&&isFinite(x))V[s.id][v[0]]=x}))}
try{merge(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(V))}catch(e){}};
let sel=new Set();
const modCount=s=>s.vars.filter(v=>V[s.id][v[0]]!==D[s.id][v[0]]).length;
const updBadge=s=>{bd[s.id].textContent=modCount(s)||''};

// ---- 사이드바 ----
const side=document.getElementById('side'),main=document.getElementById('main');
function drawSide(){
  side.innerHTML='';
  const all=$('div','item'+(sel.size?'':' on'),side);all.tabIndex=0;
  $('span','t',all).textContent='전체 섹션';
  all.onclick=()=>{sel.clear();drawSide();drawMain()};
  $('div','sep',side);
  S.forEach(s=>{
    const it=$('div','item'+(sel.has(s.id)?' on':''),side);it.tabIndex=0;
    $('span','t',it).textContent=s.title;
    bd[s.id]=$('span','bd',it);updBadge(s);
    const pick=e=>{
      if(e.ctrlKey||e.metaKey||e.shiftKey){sel.has(s.id)?sel.delete(s.id):sel.add(s.id)}
      else{sel=new Set([s.id])}
      drawSide();drawMain();
    };
    it.onclick=pick;
    it.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e)}};
  });
}

// ---- 주 영역 ----
function row(s,v,p){
  const [k,l,mn,mx,st]=v,r=$('div','row',p);
  $('label','',r).textContent=l;
  const g=$('input','',r);g.type='range';g.min=mn;g.max=mx;g.step=st;
  const n=$('input','num',r);n.type='number';n.step=st;
  const b=$('button','rs',r);b.textContent='↺';b.title='기본값으로 되돌리기';
  const round=x=>+(+x).toFixed(4);
  const put=(x,fromNum)=>{
    x=round(x);V[s.id][k]=x;g.value=x;if(!fromNum)n.value=x;
    r.classList.toggle('mod',x!==D[s.id][k]);updBadge(s);save();
  };
  g.oninput=()=>put(g.value);
  n.oninput=()=>{if(n.value!==''&&isFinite(+n.value))put(n.value,true)};
  n.onblur=()=>{n.value=V[s.id][k]};
  b.onclick=()=>put(D[s.id][k]);
  g.value=n.value=V[s.id][k];
  r.classList.toggle('mod',V[s.id][k]!==D[s.id][k]);
}
function drawMain(){
  main.innerHTML='';
  S.filter(s=>!sel.size||sel.has(s.id)).forEach(s=>{
    const sec=$('section','sec',main);
    const h=$('div','sh',sec);h.tabIndex=0;
    $('span','ar',h).textContent='▾';
    $('b','',h).textContent=s.title;
    $('span','',h).textContent=s.desc;
    const tog=()=>sec.classList.toggle('closed');
    h.onclick=tog;h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog()}};
    const body=$('div','sb',sec);
    s.vars.forEach(v=>row(s,v,body));
  });
}
const setAll=c=>main.querySelectorAll('.sec').forEach(e=>e.classList.toggle('closed',c));
bClose.onclick=()=>setAll(true);bOpen.onclick=()=>setAll(false);
bReset.onclick=()=>{if(confirm('모든 값을 기본값으로 되돌릴까요?')){S.forEach(s=>s.vars.forEach(v=>V[s.id][v[0]]=v[5]));save();drawSide();drawMain()}};
bExp.onclick=()=>{
  const a=$('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(V,null,2)],{type:'application/json'}));
  a.download='balance.json';a.click();URL.revokeObjectURL(a.href);
};
bImp.onclick=()=>file.click();
file.onchange=()=>{
  const f=file.files[0];if(!f)return;
  f.text().then(t=>{merge(JSON.parse(t));save();drawSide();drawMain()}).catch(()=>alert('JSON 파일을 읽지 못했습니다. balance.json 형식인지 확인해 주세요.'));
  file.value='';
};

// ---- 사이드바 폭 조절 ----
const split=document.getElementById('split'),wrap=document.getElementById('wrap');
const setW=w=>{w=Math.max(160,Math.min(480,w));wrap.style.setProperty('--sw',w+'px');return w};
try{const w=+localStorage.getItem(SW);if(w)setW(w)}catch(e){}
split.onpointerdown=e=>{split.setPointerCapture(e.pointerId);split.classList.add('on')};
split.onpointermove=e=>{if(split.hasPointerCapture(e.pointerId))setW(e.clientX-wrap.getBoundingClientRect().left)};
split.onpointerup=e=>{
  split.classList.remove('on');split.releasePointerCapture(e.pointerId);
  try{localStorage.setItem(SW,side.offsetWidth)}catch(_){}
};
split.onkeydown=e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setW(side.offsetWidth+(e.key==='ArrowRight'?20:-20))}
};
wrap.style.setProperty('--sw',wrap.style.getPropertyValue('--sw')||'260px');
drawSide();drawMain();
</script>
</body>
</html>
